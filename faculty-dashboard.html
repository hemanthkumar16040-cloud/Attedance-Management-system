<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Dashboard - DIET Attendance Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *::-webkit-scrollbar { display: none !important; }
    * { -ms-overflow-style: none !important; scrollbar-width: none !important; }
  </style>
</head>
<body class="bg-slate-100/70 text-slate-800 antialiased">
  <div id="app-layout-container"></div>

  <script src="shared.js"></script>
  <script>
    // Ensure faculty user
    let user = AMS.getCurrentUser();
    if (!user || (user.role !== 'faculty' && user.role !== 'admin')) {
      AMS.setCurrentUser({ role: 'faculty', name: 'Mr. B. Dileep', email: 'b.dileep@diet.edu.in', department: 'CSE' });
    }

    AMS.renderLayout('faculty-dashboard.html', 'Faculty Workspace', 'Classroom attendance registers and course rosters');

    const facultyList = AMS.getFaculty();
    const currentFaculty = facultyList.find(f => f.email === user.email) || facultyList[0];
    const subjects = AMS.getSubjects().filter(s => 
      s.faculty.toLowerCase().includes(currentFaculty.name.toLowerCase()) || 
      currentFaculty.subjectsAssigned?.some(sub => sub.toLowerCase() === s.name.toLowerCase())
    );
    const attendance = AMS.getAttendance();

    const facultySessions = attendance.filter(a => a.facultyName.toLowerCase().includes(currentFaculty.name.toLowerCase()) || subjects.some(s => s.name === a.subjectName));
    const uniqueDates = [...new Set(facultySessions.map(a => `${a.date}_${a.subjectName}_${a.time}`))];

    const contentArea = document.getElementById('page-content-area');
    contentArea.innerHTML = `
      <div class="p-4 sm:p-6 lg:p-8 space-y-6 max-w-7xl mx-auto">
        <!-- Faculty Profile Card -->
        <div class="bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 rounded-2xl p-6 text-white shadow-lg flex flex-col md:flex-row md:items-center justify-between gap-6 border border-slate-700">
          <div>
            <span class="inline-block px-3 py-1 rounded-full bg-blue-500/20 text-blue-300 text-xs font-bold uppercase tracking-wider mb-2">Faculty Member</span>
            <h2 class="text-2xl font-extrabold">${currentFaculty.name}</h2>
            <p class="text-slate-300 text-xs mt-1 font-mono">${currentFaculty.designation} • ${currentFaculty.department} • ${currentFaculty.email}</p>
          </div>
          <a href="attendance-management.html" class="px-5 py-3 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-blue-600/30 flex items-center gap-2 self-start md:self-auto transition-all cursor-pointer">
            <i class="fa-solid fa-plus"></i>
            <span>Take Classroom Attendance</span>
          </a>
        </div>

        <!-- Assigned Subjects -->
        <div>
          <h3 class="text-base font-bold text-slate-900 mb-4">Your Assigned Courses (${subjects.length})</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            ${subjects.map(s => {
              const subSessions = attendance.filter(a => a.subjectName === s.name);
              const presentCount = subSessions.filter(a => a.status === 'Present').length;
              const rate = subSessions.length > 0 ? Math.round((presentCount / subSessions.length) * 100) : 0;
              return `
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs hover:border-blue-300 transition-all flex flex-col justify-between">
                  <div>
                    <div class="flex items-center justify-between mb-2">
                      <span class="px-2.5 py-0.5 rounded text-[11px] font-mono font-bold bg-blue-50 text-blue-700 border border-blue-200">${s.code}</span>
                      <span class="text-xs font-semibold text-slate-500">${s.type}</span>
                    </div>
                    <h4 class="font-bold text-sm text-slate-900 mb-1">${s.name}</h4>
                    <p class="text-xs text-slate-500">${s.department} • ${s.semester}</p>
                  </div>
                  <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
                    <span class="text-xs text-slate-600 font-medium">${subSessions.length > 0 ? `${rate}% Attendance` : 'No logs yet'}</span>
                    <a href="attendance-management.html" class="text-xs font-bold text-blue-600 hover:underline">Mark Now &rarr;</a>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <!-- Recent Logs -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
          <div class="p-5 border-b border-slate-200 flex items-center justify-between">
            <h3 class="font-bold text-base text-slate-900">Recent Attendance Logs Conducted</h3>
            <span class="text-xs text-slate-500">${uniqueDates.length} Classes Completed</span>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold uppercase text-[11px]">
                <tr>
                  <th class="py-3 px-4">Date</th>
                  <th class="py-3 px-4">Subject</th>
                  <th class="py-3 px-4">Time</th>
                  <th class="py-3 px-4">Present / Total</th>
                  <th class="py-3 px-4 text-right">Action</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${uniqueDates.slice(0, 8).map(key => {
                  const [date, subName, time] = key.split('_');
                  const recs = facultySessions.filter(a => a.date === date && a.subjectName === subName && a.time === time);
                  const pCount = recs.filter(r => r.status === 'Present').length;
                  return `
                    <tr class="hover:bg-slate-50">
                      <td class="py-3 px-4 font-mono text-slate-800">${date}</td>
                      <td class="py-3 px-4 font-bold text-slate-900">${subName}</td>
                      <td class="py-3 px-4 text-slate-600">${time}</td>
                      <td class="py-3 px-4 font-bold text-emerald-600">${pCount} / ${recs.length} Students</td>
                      <td class="py-3 px-4 text-right">
                        <a href="reports.html" class="text-xs font-semibold text-blue-600 hover:underline">View Report</a>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    `;
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subject Management - DIET</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *::-webkit-scrollbar { display: none !important; }
    * { -ms-overflow-style: none !important; scrollbar-width: none !important; }
  </style>
</head>
<body class="bg-slate-100/70 text-slate-800 antialiased">
  <div id="app-layout-container"></div>

  <script src="shared.js"></script>
  <script>
    let user = AMS.getCurrentUser();
    if (!user || user.role !== 'admin') {
      AMS.setCurrentUser({ role: 'admin', name: 'Dr. Principal / Admin', email: 'admin@diet.edu.in' });
    }

    AMS.renderLayout('subject-management.html', 'Curriculum & Courses', 'Manage academic courses, credits, and faculty allocations');

    let subjects = AMS.getSubjects();
    let searchQuery = '';

    function renderPage() {
      const filtered = subjects.filter(s => 
        s.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
        s.code.toLowerCase().includes(searchQuery.toLowerCase()) ||
        s.faculty.toLowerCase().includes(searchQuery.toLowerCase())
      );

      const contentArea = document.getElementById('page-content-area');
      contentArea.innerHTML = `
        <div class="p-4 sm:p-6 lg:p-8 space-y-6 max-w-7xl mx-auto">
          <!-- Top Controls -->
          <div class="flex flex-col sm:flex-row items-center justify-between gap-4 bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
            <div class="relative w-full sm:w-80">
              <i class="fa-solid fa-magnifying-glass text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 text-xs"></i>
              <input
                type="text"
                id="search-input"
                placeholder="Search subject name, code, faculty..."
                value="${searchQuery}"
                class="w-full text-xs pl-9 pr-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-slate-800"
              />
            </div>

            <button onclick="openAddSubjectModal()" class="flex items-center gap-1.5 px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors shadow-sm shadow-blue-600/30 cursor-pointer">
              <i class="fa-solid fa-plus text-xs"></i>
              <span>+ Add Course / Subject</span>
            </button>
          </div>

          <!-- Subjects Table -->
          <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
            <div class="p-5 border-b border-slate-200 flex items-center justify-between">
              <div>
                <h3 class="font-bold text-base text-slate-900">Curriculum & Course Offerings</h3>
                <p class="text-xs text-slate-500">Course codes and assigned teachers</p>
              </div>
              <span class="text-xs font-bold px-3 py-1 bg-amber-50 text-amber-700 rounded-full border border-amber-200">
                ${filtered.length} Subjects
              </span>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs min-w-[650px]">
                <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold uppercase text-[11px]">
                  <tr>
                    <th class="py-3 px-4">Subject Code</th>
                    <th class="py-3 px-4">Subject Name</th>
                    <th class="py-3 px-4">Department & Sem</th>
                    <th class="py-3 px-4">Course Type</th>
                    <th class="py-3 px-4">Assigned Faculty</th>
                    <th class="py-3 px-4 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${filtered.map(s => `
                    <tr class="hover:bg-slate-50">
                      <td class="py-3 px-4 font-mono font-bold text-blue-700">${s.code}</td>
                      <td class="py-3 px-4 font-bold text-slate-900">${s.name}</td>
                      <td class="py-3 px-4 text-slate-600">${s.department} • ${s.semester}</td>
                      <td class="py-3 px-4">
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold ${s.type.includes('Lab') ? 'bg-purple-50 text-purple-700 border border-purple-200' : 'bg-blue-50 text-blue-700 border border-blue-200'}">
                          ${s.type}
                        </span>
                      </td>
                      <td class="py-3 px-4 font-medium text-slate-800">${s.faculty}</td>
                      <td class="py-3 px-4 text-right space-x-2">
                        <button onclick="editFacultyAssignment('${s.id}')" class="text-blue-600 hover:text-blue-800 font-semibold text-xs cursor-pointer">
                          Reassign
                        </button>
                        <button onclick="deleteSubject('${s.id}')" class="text-rose-600 hover:text-rose-800 font-semibold text-xs cursor-pointer">
                          Remove
                        </button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;

      document.getElementById('search-input').oninput = (e) => {
        searchQuery = e.target.value;
        renderPage();
      };
    }

    function editFacultyAssignment(id) {
      const s = subjects.find(item => item.id === id);
      if (!s) return;
      const newFac = prompt(`Assign new faculty for ${s.name}:`, s.faculty);
      if (newFac !== null && newFac.trim() !== '') {
        s.faculty = newFac.trim();
        AMS.saveSubjects(subjects);
        renderPage();
      }
    }

    function deleteSubject(id) {
      if (confirm('Are you sure you want to remove this course?')) {
        subjects = subjects.filter(s => s.id !== id);
        AMS.saveSubjects(subjects);
        renderPage();
      }
    }

    function openAddSubjectModal() {
      const code = prompt('Enter Course Code (e.g. CM510):');
      if (!code) return;
      const name = prompt('Enter Subject Name:');
      if (!name) return;
      const facultyName = prompt('Enter Assigned Faculty Name:', 'Mr. B. Dileep') || 'Mr. B. Dileep';

      subjects.push({
        id: `s_${Date.now()}`,
        code: code.trim().toUpperCase(),
        name: name.trim(),
        department: 'CSE',
        semester: '5th Semester',
        faculty: facultyName.trim(),
        type: name.toLowerCase().includes('lab') ? 'Practical / Lab' : 'Theory'
      });
      AMS.saveSubjects(subjects);
      renderPage();
    }

    renderPage();
  </script>
</body>
</html>

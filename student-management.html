<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management - DIET</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *::-webkit-scrollbar { display: none !important; }
    * { -ms-overflow-style: none !important; scrollbar-width: none !important; }
  </style>
</head>
<body class="bg-slate-100/70 text-slate-800 antialiased">
  <div id="app-layout-container"></div>

  <script src="shared.js"></script>
  <script>
    let user = AMS.getCurrentUser();
    if (!user || user.role === 'student') {
      AMS.setCurrentUser({ role: 'admin', name: 'Dr. Principal / Admin', email: 'admin@diet.edu.in' });
    }

    AMS.renderLayout('student-management.html', 'Student Directory & Credentials', 'Manage student roll numbers, passwords, and roster data');

    let students = AMS.getStudents();
    let searchQuery = '';
    let selectedDept = 'ALL';

    function renderPage() {
      const filtered = students.filter(s => {
        const matchesSearch = s.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              s.rollNumber.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesDept = selectedDept === 'ALL' || s.department === selectedDept;
        return matchesSearch && matchesDept;
      });

      const contentArea = document.getElementById('page-content-area');
      contentArea.innerHTML = `
        <div class="p-4 sm:p-6 lg:p-8 space-y-6 max-w-7xl mx-auto">
          <!-- Top Search & Actions -->
          <div class="flex flex-col sm:flex-row items-center justify-between gap-4 bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
            <div class="flex items-center gap-3 w-full sm:w-auto flex-1 max-w-lg">
              <div class="relative w-full">
                <i class="fa-solid fa-magnifying-glass text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 text-xs"></i>
                <input
                  type="text"
                  id="search-input"
                  placeholder="Search by student name or roll number..."
                  value="${searchQuery}"
                  class="w-full text-xs pl-9 pr-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-slate-800"
                />
              </div>
              <select id="dept-filter" class="text-xs py-2 px-3 border border-slate-300 rounded-lg bg-white font-medium text-slate-700">
                <option value="ALL" ${selectedDept === 'ALL' ? 'selected' : ''}>All Depts</option>
                <option value="CSE" ${selectedDept === 'CSE' ? 'selected' : ''}>CSE</option>
                <option value="ECE" ${selectedDept === 'ECE' ? 'selected' : ''}>ECE</option>
                <option value="MECH" ${selectedDept === 'MECH' ? 'selected' : ''}>MECH</option>
              </select>
            </div>

            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
              <button onclick="exportCSV()" class="flex items-center gap-1.5 px-3 py-2 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors border border-slate-200 cursor-pointer">
                <i class="fa-solid fa-download text-xs"></i>
                <span>Export CSV</span>
              </button>
              <button onclick="openAddModal()" class="flex items-center gap-1.5 px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors shadow-sm shadow-blue-600/30 cursor-pointer">
                <i class="fa-solid fa-plus text-xs"></i>
                <span>+ Add Student</span>
              </button>
            </div>
          </div>

          <!-- Students Table -->
          <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
            <div class="p-5 border-b border-slate-200 flex items-center justify-between">
              <div>
                <h3 class="font-bold text-base text-slate-900">Student & Login Credentials Management</h3>
                <p class="text-xs text-slate-500">Student roll IDs and passwords</p>
              </div>
              <span class="text-xs font-bold px-3 py-1 bg-blue-50 text-blue-700 rounded-full border border-blue-200">
                ${filtered.length} Students
              </span>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs min-w-[700px]">
                <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold uppercase text-[11px]">
                  <tr>
                    <th class="py-3 px-4">Login ID (Roll No)</th>
                    <th class="py-3 px-4">Student Name</th>
                    <th class="py-3 px-4">Department & Sem</th>
                    <th class="py-3 px-4">Assigned Password</th>
                    <th class="py-3 px-4 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${filtered.map(s => `
                    <tr class="hover:bg-slate-50">
                      <td class="py-3 px-4 font-mono font-bold text-slate-900">${s.rollNumber}</td>
                      <td class="py-3 px-4 font-bold text-slate-800">${s.name}</td>
                      <td class="py-3 px-4 text-slate-600">${s.department} • ${s.semester}</td>
                      <td class="py-3 px-4 font-mono text-slate-700 bg-slate-50/50">
                        <span class="px-2 py-1 rounded bg-slate-100 border border-slate-200">${s.password || 'student123'}</span>
                      </td>
                      <td class="py-3 px-4 text-right space-x-2">
                        <button onclick="editStudent('${s.id}')" class="text-blue-600 hover:text-blue-800 font-semibold text-xs cursor-pointer">
                          Edit Password
                        </button>
                        <button onclick="deleteStudent('${s.id}')" class="text-rose-600 hover:text-rose-800 font-semibold text-xs cursor-pointer">
                          Delete
                        </button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;

      document.getElementById('search-input').oninput = (e) => {
        searchQuery = e.target.value;
        renderPage();
      };
      document.getElementById('dept-filter').onchange = (e) => {
        selectedDept = e.target.value;
        renderPage();
      };
    }

    function exportCSV() {
      const headers = ['ID,Roll Number,Name,Department,Year,Semester,Email,Password\n'];
      const rows = students.map(s => `"${s.id}","${s.rollNumber}","${s.name}","${s.department}","${s.year}","${s.semester}","${s.email}","${s.password || 'student123'}"`).join('\n');
      const blob = new Blob([headers + rows], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `DIET_Students_Roster.csv`;
      a.click();
    }

    function editStudent(id) {
      const s = students.find(item => item.id === id);
      if (!s) return;
      const newPass = prompt(`Set new login password for ${s.name} (${s.rollNumber}):`, s.password || 'student123');
      if (newPass !== null && newPass.trim() !== '') {
        s.password = newPass.trim();
        AMS.saveStudents(students);
        renderPage();
      }
    }

    function deleteStudent(id) {
      if (confirm('Are you sure you want to remove this student record?')) {
        students = students.filter(s => s.id !== id);
        AMS.saveStudents(students);
        renderPage();
      }
    }

    function openAddModal() {
      const roll = prompt('Enter Student Roll Number (e.g. 24349cm086):');
      if (!roll) return;
      const name = prompt('Enter Student Full Name:');
      if (!name) return;
      const password = prompt('Enter Login Password:', 'student123') || 'student123';

      const newStudent = {
        id: String(Date.now()),
        rollNumber: roll.trim(),
        name: name.trim(),
        department: 'CSE',
        year: '3rd Year',
        semester: '5th Semester',
        email: `${roll.trim().toLowerCase()}@diet.edu.in`,
        password: password.trim()
      };

      students.push(newStudent);
      AMS.saveStudents(students);
      renderPage();
      alert(`Student ${name} added successfully!`);
    }

    renderPage();
  </script>
</body>
</html>

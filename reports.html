<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Reports - DIET</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *::-webkit-scrollbar { display: none !important; }
    * { -ms-overflow-style: none !important; scrollbar-width: none !important; }
  </style>
</head>
<body class="bg-slate-100/70 text-slate-800 antialiased">
  <div id="app-layout-container"></div>

  <script src="shared.js"></script>
  <script>
    let user = AMS.getCurrentUser();
    if (!user) {
      AMS.setCurrentUser({ role: 'admin', name: 'Dr. Principal / Admin', email: 'admin@diet.edu.in' });
      user = AMS.getCurrentUser();
    }

    AMS.renderLayout('reports.html', 'Attendance Reports & Logs', 'Filter, inspect, and export institutional attendance registers');

    const allRecords = AMS.getAttendance();
    const subjects = AMS.getSubjects();

    let selectedSubject = 'ALL';
    let statusFilter = 'ALL';
    let searchQuery = '';

    function renderPage() {
      let filtered = allRecords.filter(r => {
        if (user.role === 'student') {
          return r.studentRollNumber.toLowerCase() === (user.rollNumber || '').toLowerCase();
        }
        return true;
      });

      if (selectedSubject !== 'ALL') {
        filtered = filtered.filter(r => r.subjectId === selectedSubject);
      }
      if (statusFilter !== 'ALL') {
        filtered = filtered.filter(r => r.status === statusFilter);
      }
      if (searchQuery.trim() !== '') {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(r => 
          r.studentName.toLowerCase().includes(q) || 
          r.studentRollNumber.toLowerCase().includes(q) ||
          r.subjectName.toLowerCase().includes(q)
        );
      }

      const total = filtered.length;
      const presentCount = filtered.filter(r => r.status === 'Present').length;
      const absentCount = filtered.filter(r => r.status === 'Absent').length;
      const rate = total > 0 ? Math.round((presentCount / total) * 100) : 0;

      const contentArea = document.getElementById('page-content-area');
      contentArea.innerHTML = `
        <div class="p-4 sm:p-6 lg:p-8 space-y-6 max-w-7xl mx-auto">
          <!-- Filters -->
          <div class="bg-white rounded-2xl border border-slate-200 shadow-xs p-5 sm:p-6">
            <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-100">
              <div>
                <h3 class="text-base font-bold text-slate-900">Attendance Report Filters</h3>
                <p class="text-xs text-slate-500">Filter records by subject, status, or student name</p>
              </div>
              <button onclick="clearFilters()" class="text-xs font-semibold text-slate-500 hover:text-slate-800 underline cursor-pointer">
                Clear Filters
              </button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Subject Filter</label>
                <select id="sub-filter" class="w-full text-xs py-2 px-3 border border-slate-300 rounded-lg bg-white font-medium text-slate-800">
                  <option value="ALL">All Subjects</option>
                  ${subjects.map(s => `
                    <option value="${s.id}" ${s.id === selectedSubject ? 'selected' : ''}>${s.code} - ${s.name}</option>
                  `).join('')}
                </select>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Status</label>
                <div class="flex gap-2">
                  <button onclick="setStatus('ALL')" class="flex-1 py-2 text-xs font-semibold rounded-lg border transition-all cursor-pointer ${statusFilter === 'ALL' ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50 text-slate-700 border-slate-200'}">All</button>
                  <button onclick="setStatus('Present')" class="flex-1 py-2 text-xs font-semibold rounded-lg border transition-all cursor-pointer ${statusFilter === 'Present' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-50 text-slate-700 border-slate-200'}">Present</button>
                  <button onclick="setStatus('Absent')" class="flex-1 py-2 text-xs font-semibold rounded-lg border transition-all cursor-pointer ${statusFilter === 'Absent' ? 'bg-rose-600 text-white border-rose-600' : 'bg-slate-50 text-slate-700 border-slate-200'}">Absent</button>
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Search Student / Roll No</label>
                <input
                  type="text"
                  id="search-input"
                  placeholder="Roll No or Name..."
                  value="${searchQuery}"
                  class="w-full text-xs py-2 px-3 border border-slate-300 rounded-lg font-medium text-slate-800"
                />
              </div>
            </div>
          </div>

          <!-- Summary Stats -->
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
              <span class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider">Total Records</span>
              <h4 class="text-2xl font-bold text-slate-900 mt-1">${total}</h4>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
              <span class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider">Total Present</span>
              <h4 class="text-2xl font-bold text-emerald-600 mt-1">${presentCount}</h4>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
              <span class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider">Total Absent</span>
              <h4 class="text-2xl font-bold text-rose-600 mt-1">${absentCount}</h4>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
              <span class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider">Attendance Rate</span>
              <h4 class="text-2xl font-bold text-blue-600 mt-1">${rate}%</h4>
            </div>
          </div>

          <!-- Register Table -->
          <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
            <div class="p-5 border-b border-slate-200 flex items-center justify-between">
              <div>
                <h3 class="font-bold text-base text-slate-900">Attendance Register Logs</h3>
                <p class="text-xs text-slate-500">Filtered session records</p>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="exportCSV()" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors border border-slate-200 cursor-pointer">
                  <i class="fa-solid fa-download text-xs"></i>
                  <span>Export CSV</span>
                </button>
                <button onclick="window.print()" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors border border-slate-200 cursor-pointer">
                  <i class="fa-solid fa-print text-xs"></i>
                  <span>Print</span>
                </button>
              </div>
            </div>

            <div class="overflow-x-auto max-h-[600px] overflow-y-auto">
              <table class="w-full text-left text-xs min-w-[650px]">
                <thead class="sticky top-0 bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold uppercase text-[11px]">
                  <tr>
                    <th class="py-3 px-4">Roll No</th>
                    <th class="py-3 px-4">Student Name</th>
                    <th class="py-3 px-4">Subject</th>
                    <th class="py-3 px-4">Date & Time</th>
                    <th class="py-3 px-4">Faculty</th>
                    <th class="py-3 px-4 text-right">Status</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${filtered.slice(0, 100).map(r => `
                    <tr class="hover:bg-slate-50">
                      <td class="py-3 px-4 font-mono font-bold text-slate-900">${r.studentRollNumber}</td>
                      <td class="py-3 px-4 font-medium text-slate-800">${r.studentName}</td>
                      <td class="py-3 px-4 font-medium text-blue-700">${r.subjectName}</td>
                      <td class="py-3 px-4 text-slate-600 font-mono">${r.date} ${r.time}</td>
                      <td class="py-3 px-4 text-slate-600">${r.facultyName}</td>
                      <td class="py-3 px-4 text-right">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold ${r.status === 'Present' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                          ${r.status}
                        </span>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;

      document.getElementById('sub-filter').onchange = (e) => {
        selectedSubject = e.target.value;
        renderPage();
      };
      document.getElementById('search-input').oninput = (e) => {
        searchQuery = e.target.value;
        renderPage();
      };
    }

    function setStatus(s) {
      statusFilter = s;
      renderPage();
    }

    function clearFilters() {
      selectedSubject = 'ALL';
      statusFilter = 'ALL';
      searchQuery = '';
      renderPage();
    }

    function exportCSV() {
      const headers = ['Roll Number,Student Name,Subject,Date,Time,Faculty,Status\n'];
      const rows = allRecords.map(r => `"${r.studentRollNumber}","${r.studentName}","${r.subjectName}","${r.date}","${r.time}","${r.facultyName}","${r.status}"`).join('\n');
      const blob = new Blob([headers + rows], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `DIET_Attendance_Reports.csv`;
      a.click();
    }

    renderPage();
  </script>
</body>
</html>

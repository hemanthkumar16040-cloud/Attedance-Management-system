<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Management - DIET</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *::-webkit-scrollbar { display: none !important; }
    * { -ms-overflow-style: none !important; scrollbar-width: none !important; }
  </style>
</head>
<body class="bg-slate-100/70 text-slate-800 antialiased">
  <div id="app-layout-container"></div>

  <script src="shared.js"></script>
  <script>
    let user = AMS.getCurrentUser();
    if (!user || user.role !== 'admin') {
      AMS.setCurrentUser({ role: 'admin', name: 'Dr. Principal / Admin', email: 'admin@diet.edu.in' });
    }

    AMS.renderLayout('faculty-management.html', 'Faculty Directory', 'Teaching faculty, subject assignments, and login credentials');

    let faculty = AMS.getFaculty();
    let subjects = AMS.getSubjects();
    let searchQuery = '';

    function renderPage() {
      const filtered = faculty.filter(f => 
        f.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
        f.department.toLowerCase().includes(searchQuery.toLowerCase()) ||
        f.email.toLowerCase().includes(searchQuery.toLowerCase())
      );

      const contentArea = document.getElementById('page-content-area');
      contentArea.innerHTML = `
        <div class="p-4 sm:p-6 lg:p-8 space-y-6 max-w-7xl mx-auto">
          <!-- Top Search & Actions -->
          <div class="flex flex-col sm:flex-row items-center justify-between gap-4 bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
            <div class="relative w-full sm:w-80">
              <i class="fa-solid fa-magnifying-glass text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 text-xs"></i>
              <input
                type="text"
                id="search-input"
                placeholder="Search faculty name, department..."
                value="${searchQuery}"
                class="w-full text-xs pl-9 pr-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-slate-800"
              />
            </div>

            <button onclick="openAddFacultyModal()" class="flex items-center gap-1.5 px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors shadow-sm shadow-blue-600/30 cursor-pointer">
              <i class="fa-solid fa-plus text-xs"></i>
              <span>+ Add Faculty Member</span>
            </button>
          </div>

          <!-- Faculty Cards Grid -->
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            ${filtered.map(fac => {
              const linkedSubjects = subjects.filter(s => 
                s.faculty.toLowerCase().includes(fac.name.toLowerCase()) || 
                fac.subjectsAssigned?.some(sub => sub.toLowerCase() === s.name.toLowerCase())
              );
              return `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-xs p-6 flex flex-col justify-between hover:border-slate-300 transition-all">
                  <div>
                    <div class="flex items-start justify-between gap-3 mb-3">
                      <div>
                        <span class="inline-block px-2.5 py-0.5 rounded text-[10px] font-bold bg-blue-50 text-blue-700 border border-blue-200 mb-1">
                          ${fac.department} • ${fac.designation}
                        </span>
                        <h3 class="font-bold text-base text-slate-900 leading-tight">${fac.name}</h3>
                      </div>
                      <div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center text-slate-600 font-bold text-sm shrink-0 border border-slate-200">
                        ${fac.name.charAt(0)}
                      </div>
                    </div>

                    <div class="space-y-1.5 text-xs text-slate-600 mt-3 pt-3 border-t border-slate-100">
                      <p><i class="fa-solid fa-envelope w-4 text-slate-400"></i> ${fac.email}</p>
                      <p><i class="fa-solid fa-phone w-4 text-slate-400"></i> ${fac.phone}</p>
                      <p class="font-mono bg-slate-50 p-1.5 rounded border border-slate-100"><i class="fa-solid fa-key w-4 text-slate-400"></i> Password: <strong>${fac.password || 'faculty123'}</strong></p>
                    </div>

                    <div class="mt-4 pt-3 border-t border-slate-100">
                      <span class="block text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-2">Assigned Courses (${linkedSubjects.length})</span>
                      <div class="flex flex-wrap gap-1.5">
                        ${linkedSubjects.map(s => `
                          <span class="px-2 py-0.5 rounded text-[11px] font-medium bg-slate-100 text-slate-700 border border-slate-200">
                            ${s.name}
                          </span>
                        `).join('')}
                      </div>
                    </div>
                  </div>

                  <div class="mt-5 pt-3 border-t border-slate-100 flex items-center justify-between">
                    <button onclick="editFaculty('${fac.id}')" class="text-xs font-bold text-blue-600 hover:text-blue-800 cursor-pointer">
                      Edit Details
                    </button>
                    <button onclick="deleteFaculty('${fac.id}')" class="text-xs font-bold text-rose-600 hover:text-rose-800 cursor-pointer">
                      Remove
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;

      document.getElementById('search-input').oninput = (e) => {
        searchQuery = e.target.value;
        renderPage();
      };
    }

    function editFaculty(id) {
      const f = faculty.find(item => item.id === id);
      if (!f) return;
      const newPass = prompt(`Set login password for ${f.name}:`, f.password || 'faculty123');
      if (newPass !== null && newPass.trim() !== '') {
        f.password = newPass.trim();
        AMS.saveFaculty(faculty);
        renderPage();
      }
    }

    function deleteFaculty(id) {
      if (confirm('Are you sure you want to remove this faculty record?')) {
        faculty = faculty.filter(f => f.id !== id);
        AMS.saveFaculty(faculty);
        renderPage();
      }
    }

    function openAddFacultyModal() {
      const name = prompt('Enter Faculty Full Name (e.g. Dr. K. Sharma):');
      if (!name) return;
      const email = prompt('Enter Email:', `${name.toLowerCase().replace(/[^a-z]/g, '')}@diet.edu.in`) || 'faculty@diet.edu.in';
      const designation = prompt('Enter Designation (e.g. Assistant Professor):', 'Assistant Professor') || 'Assistant Professor';

      faculty.push({
        id: `f_${Date.now()}`,
        name: name.trim(),
        department: 'CSE',
        designation: designation.trim(),
        email: email.trim(),
        phone: '+91 9876543219',
        subjectsAssigned: ['Android Programming'],
        password: 'faculty123'
      });
      AMS.saveFaculty(faculty);
      renderPage();
    }

    renderPage();
  </script>
</body>
</html>
